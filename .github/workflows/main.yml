name: Build PrimeShani APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y \
            zip unzip git \
            libtool libtool-bin \
            m4 automake autoconf \
            cmake pkg-config \
            libffi-dev libssl-dev \
            zlib1g-dev

      - name: Install Python packages
        run: |
          pip install buildozer cython==0.29.37 kivy

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: PrimeShani-APK
          path: bin/*.apk
