name: Build PrimeShani APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y zip unzip git libtool libtool-bin m4 automake autoconf cmake pkg-config libffi-dev libssl-dev zlib1g-dev

      - name: Install Python packages
        run: |
          pip install buildozer cython==0.29.37

      - name: Fix buildozer spec
        run: |
          sed -i 's/android.api = 33/android.api = 31/' buildozer.spec
          sed -i 's/android.ndk = 25b/android.ndk = 23b/' buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec

      - name: Accept SDK licenses manually
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build APK
        run: |
          buildozer android debug 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimeShani-APK
          path: bin/*.apk
